<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>دفتري</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1a3a">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتري">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="twinkles" aria-hidden="true"><i class="shoot"></i><i class="shoot s2"></i></div>
<div class="moon" aria-hidden="true"></div>

<!-- المكتبة -->
<section id="library" class="view">
  <header class="lib-head">
    <div class="brand">
      <img src="icon.svg" alt="" width="44" height="44">
      <div><h1>دفتري</h1><p class="tag">ورق، حبر، وليل هادئ للكتابة والدراسة</p></div>
    </div>
    <div class="lib-actions">
      <button class="btn ghost" id="btnCal" title="تقويم الدراسة" data-ic="calendar"><span>التقويم</span><b class="badge" id="calBadge" hidden></b></button>
      <button class="btn ghost" id="btnSubj" title="مادة جديدة: بتجمع كتبها وملفات الـPDF تبعها" data-ic="folder"><span>مادة جديدة</span></button>
      <button class="btn primary" id="btnNew" data-ic="plus">كتاب جديد</button>
      <button class="ib" id="btnQuick" title="ملاحظة سريعة (Alt+N) — بتنحفظ بدفتر «مسودات»" data-ic="edit"></button>
      <button class="ib" id="btnSettings" title="الإعدادات" data-ic="gear"></button>
      <button class="ib" id="btnLibMore" title="المزيد" data-ic="more"></button>
    </div>
  </header>
  <div id="shelves"></div>
</section>

<!-- الكتاب -->
<div class="corner" id="libraryCorner"><button id="btnNightLib" class="ib floating" title="التذكيرات والمؤقت" data-ic="bell"></button><button id="btnSoundLib" class="ib floating" title="موسيقى الخلفية" data-ic="music"></button></div>
<section id="reader" class="view" hidden>
  <div id="stage">
    <div id="book">
      <div id="bookInner">
        <div class="cast cast-left"></div><div class="cast cast-right"></div>
        <div class="slot left"></div><div class="slot right"></div>
      </div>
    </div>
  </div>
  <button id="toolToggle" class="ib floating" type="button" title="أدوات الكتابة" aria-label="افتح أدوات الكتابة" aria-controls="selbar" aria-expanded="false" data-ic="edit"></button>
  <button id="studyToggle" class="ib floating" type="button" title="أدوات الكتاب والدراسة" aria-label="افتح أدوات الكتاب والدراسة" aria-controls="studyRail" aria-expanded="false" data-ic="list"></button>
  <div id="studyRail" role="group" aria-label="أدوات الدراسة">
    <div class="rail-book"><b id="tbTitle"></b><span id="tbSeries"></span></div>
    <button class="rail-action" id="tbInfo" title="عنوان الكتاب وأجزاؤه" aria-label="عنوان الكتاب وأجزاؤه" data-ic="series"></button>
    <button class="rail-action" id="tbBack" title="رجوع للمكتبة" data-ic="books"><span>المكتبة</span></button>
    <button class="rail-action" id="tbSearch" title="بحث (Ctrl+F)" data-ic="search"><span>بحث</span></button>
    <button class="rail-action" id="tbInsert" title="إدراج: جدول، كود، صور، فيديو، صوت…" data-ic="plus"><span>إدراج</span></button>
    <button class="rail-action" id="tbMore" title="المزيد: PDF، الغلاف، تسجيل صوت، كل الأدوات (Ctrl+/)" data-ic="more"><span>المزيد</span></button>
    <button class="rail-action" id="tbPaper" title="إعدادات هالكتاب: الورق والخط والموسيقى" data-ic="sliders"><span>إعدادات الكتاب</span></button>
    <button class="rail-action" id="tbFocus" title="وضع التركيز (Ctrl+Shift+F)" data-ic="focus"><span>وضع التركيز</span></button>
    <button class="rail-action" id="tbIndex" title="الفهرس" data-ic="list"><span>الفهرس</span></button>
    <button class="rail-action" id="tbWeb" title="شبكة الأفكار (Ctrl+G)" data-ic="web"><span>شبكة الأفكار</span></button>
    <button class="rail-action" id="btnNight" title="التذكيرات والمؤقت" data-ic="bell"><span>التنبيهات</span></button>
    <button class="rail-action" id="btnSound" title="موسيقى الخلفية" data-ic="music"><span>الموسيقى</span></button>
    <span id="streak" class="streak" hidden></span>
  </div>
  <button id="sessionDial" type="button" title="مؤقت الدراسة" aria-label="مؤقت الدراسة"><span id="sessionTime">ابدأ</span></button>

  <div id="topbar" hidden aria-hidden="true"></div>

  <div id="navbar" class="bar bottom">
    <button class="ib" id="navPrev" title="الصفحة السابقة"></button>
    <input type="range" id="pgRange" min="-1" max="1" step="1" aria-label="التنقل بين الصفحات">
    <button class="pginfo" id="pgInfo" title="اذهب إلى صفحة"></button>
    <button class="ib" id="navNext" title="الصفحة التالية"></button>
  </div>
</section>

<div id="rope"></div>
<div id="imageViewer" hidden role="dialog" aria-modal="true" aria-label="عرض الصورة كاملة"><button id="imageViewerClose" type="button" aria-label="إغلاق الصورة">×</button><img alt="الصورة بالحجم الكامل"></div>
<div id="toasts" aria-live="polite"></div>
<div id="selbar" class="selbar" hidden></div>
<div id="blockbar" class="selbar small" hidden></div>
<div id="print"></div>

<script src="js/core.js"></script>
<script src="js/library.js"></script>
<script src="js/reader.js"></script>
<script src="js/editor.js"></script>
<script src="js/extras.js"></script>
<script src="js/fonts.js"></script>
<script src="js/settings.js"></script>
<script src="js/music.js"></script>
<script src="js/share.js"></script>
<script src="js/study.js"></script>
<script src="js/subjects.js"></script>
<script src="js/calendar.js"></script>
<script src="js/finder.js"></script>
<script src="js/ideaweb.js"></script>
<script src="js/tour.js"></script>
<script src="js/palette.js"></script>
<script src="js/pwa.js"></script>
<script src="js/onboard.js"></script>
<script src="js/sheet.js"></script>
<script src="js/prayer.js"></script>
<script src="js/quick.js"></script>
<script src="js/math.js"></script>
<script src="js/main.js"></script>
</body>
</html>
